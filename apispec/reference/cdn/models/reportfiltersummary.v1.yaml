title: reportfiltersummary
type: object
description: 'An object that can be passed to summary report API calls to filter and group the results. For example, you can specify to return data only for a particular hostname. Resellers can also filter and group by customer IDs to distinguish their child customers.'
x-examples:
  Filter by a specific hostname:
    filters:
      hostnames:
        - domain.info
  Group results by hostnames:
    groupBy:
      - hostnames
properties:
  filters:
    type: object
    description: Filters let you refine the results that are returned.
    properties:
      hostnames:
        type: array
        description: 'List of hostnames for which to return data. Wildcard hostnames such as *.domain.com are also permitted. If unspecified, data from all hostnames will be returned.'
        items:
          type: string
      serverGroups:
        type: array
        description: Indicates one or more server groups.
        items:
          type: string
          enum:
            - standard
            - premium
            - deluxe
            - ultra
            - nearChina
            - ChinaStandard
            - ChinaPremium
      customerIds:
        type: array
        description: Resellers can limit the data by specifying IDs of child customers.
        items:
          type: integer
      propertyHostnames:
        type: array
        x-stoplight:
          id: b2tgrmbucwte0
        description: 'A list of property hostnames for which to return data. These correspond to values in the <i>hostnames</i> field of a property configuration. These can differ from the value sent in an HTTP request. For example, if you <a href="#operation/createProperty">create a property</a> to accelerate ''*.test.com'', a client could request content and pass a Host header of ''abc.test.com''. In this case, ''\*.test.com'' is a property hostname you can filter by using this field while ''abc.test.com'' is a hostname you can filter by using the hostnames field. By default, data for all property hostnames is returned.'
        items:
          x-stoplight:
            id: jupf0i5duxcal
          type: string
      legacyTypes:
        type: array
        x-stoplight:
          id: 8d106pe2q077q
        description: 'A list of service types for which to return data. This field is only useful for customers whose contracts stipulate service '
        items:
          x-stoplight:
            id: 5mw2na0z0x049
          type: string
  groupBy:
    type: array
    description: 'You can group results using a combination of up to two of the following: ''hostnames'', ''serverGroups'', ''customerIds'', ''propertyHostnames'', and ''legacyTypes''. Only resellers can specify ''customerIds''.'
    maxItems: 2
    items:
      type: string
      enum:
        - hostnames
        - serverGroups
        - customerIds
        - propertyHostnames
        - legacyTypes
