title: logConfiguration.v1
type: object
description: Log configuration format.
properties:
  description:
    type: string
    description: A description of the log configuration.
  hostnames:
    type: array
    description: 'A list of hostnames to which the log configuration applies. A hostname should be a fully qualified domain name like <i>domain.com</i>, a wildcard domain name with a leading ''\*'' like <i>\*.domain.com</i>, or ''\*'' if you want the log configuration to apply to all hostnames. You should ensure that only one log configuration applies to each hostname.'
    items:
      type: string
  logDownloadFormat:
    type: string
    description: |-
      Format of the log entry. You can use the following variables to create a custom format:
      <table>
      <tr><th>Variable</th><th>Meaning</th></tr>
      <tr><td>%apachet</td><td>Time in the Common Log Format, for example, 03/Apr/2023:07:49:03 +0000</td></tr>
      <tr><td>%cachestate</td><td>HIT, MISS, or REVALIDATE</td></tr>
      <tr><td>%cltip</td><td>Client IP address</td></tr>
      <tr><td>%cltisp</td><td>Client ISP</td></tr>
      <tr><td>%cltport</td><td>Client port number</td></tr>
      <tr><td>%cltregion</td><td>Client region</td></tr>
      <tr><td>%content_code</td><td>Content code. Values can be set in Edge Logic by <a href="/docs/edge-logic/faq#how-to-classify-traffic-in-reports-based-on-custom-rules">setting the $content_code variable</a>.</td></tr>
      <tr><td>%cpu_ns</td><td>CPU time in nanoseconds for this request</td></tr>
      <tr><td>%custom_0</td><td>Refers to a custom log field with ID 0 you define using the <a href="/docs/edge-logic/supported-directives#custom_log_field">custom_log_field directive</a>.</td></tr>
      <tr><td>%custom_1</td><td>Refers to a custom log field with ID 1 you define using the <a href="/docs/edge-logic/supported-directives#custom_log_field">custom_log_field directive</a>.</td></tr>
      <tr><td>%custom_2</td><td>Refers to a custom log field with ID 2 you define using the <a href="/docs/edge-logic/supported-directives#custom_log_field">custom_log_field directive</a>.</td></tr>
      <tr><td>%custom_3</td><td>Refers to a custom log field with ID 3 you define using the <a href="/docs/edge-logic/supported-directives#custom_log_field">custom_log_field directive</a>.</td></tr>
      <tr><td>%custom_4</td><td>Refers to a custom log field with ID 4 you define using the <a href="/docs/edge-logic/supported-directives#custom_log_field">custom_log_field directive</a>.</td></tr>
      <tr><td>%custom_5</td><td>Refers to a custom log field with ID 5 you define using the <a href="/docs/edge-logic/supported-directives#custom_log_field">custom_log_field directive</a>.</td></tr>
      <tr><td>%custom_6</td><td>Refers to a custom log field with ID 6 you define using the <a href="/docs/edge-logic/supported-directives#custom_log_field">custom_log_field directive</a>.</td></tr>
      <tr><td>%custom_7</td><td>Refers to a custom log field with ID 7 you define using the <a href="/docs/edge-logic/supported-directives#custom_log_field">custom_log_field directive</a>.</td></tr>
      <tr><td>%custom_8</td><td>Refers to a custom log field with ID 8 you define using the <a href="/docs/edge-logic/supported-directives#custom_log_field">custom_log_field directive</a>.</td></tr>
      <tr><td>%custom_9</td><td>Refers to a custom log field with ID 9 you define using the <a href="/docs/edge-logic/supported-directives#custom_log_field">custom_log_field directive</a>.</td></tr>
      <tr><td>%hostname</td><td>Host header</td></tr>
      <tr><td>%method</td><td>HTTP method used to access the content, for example, GET</td></tr>
      <tr><td>%protocol</td><td>HTTP/1.0 or HTTP/1.1 or HTTP2.0</td></tr>
      <tr><td>%querystr</td><td>Query string</td></tr>      
      <tr><td>%referer</td><td>Referer request header</td></tr>
      <tr><td>%reqhdrsize</td><td>Request header size in bytes</td></tr>
      <tr><td>%reqrange</td><td>Range header in requests from client</td></tr>
      <tr><td>%reqsize</td><td>Request size in bytes including the request line, header, and request body</td></tr>
      <tr><td>%rmtuser</td><td>User name extracted from the Authorization header when basic authentication is used</td></tr>
      <tr><td>%rspsize</td><td>HTTP response size, in bytes, including header and body, but not including TCP/IP/MAC</td></tr>
      <tr><td>%rsptime</td><td>Response time in milliseconds</td></tr>
      <tr><td>%samplerate</td><td>Number of requests corresponding to each log entry</td></tr>
      <tr><td>%scheme</td><td>http or https</td></tr>
      <tr><td>%statuscode</td><td>Response's status code, for example, 200</td></tr>
      <tr><td>%svrip</td><td>IP address of the CDN server handling the request</td></tr>
      <tr><td>%svrnode</td><td>Cache server node name</td></tr>
      <tr><td>%tcprtt</td><td>Round-trip time between server and client in microseconds</td></tr>      
      <tr><td>%ua</td><td>User-Agent header</td></tr>
      <tr><td>%uniqueid</td><td>A string uniquely identifying this request</td></tr>       
      <tr><td>%url</td><td>Full URL with query string, if any</td></tr>
      <tr><td>%utctime</td><td>RFC 3339 timestamp of the response, for example, 2021-10-05T12:34:56Z</td></tr>
      </table>
      If any variable value contains non-printable characters (ASCII characters <=0x1F or >=0x7F), double quotes, or a backslash, each of those characters will be escaped to a format like "\xXX". For example, double quotes will become "\x22" and backslash will become "\x5C".
      Note that space is not escaped. You must quote variables that may contain spaces to facilitate parsing.
    default: '%cltip %rmtuser  [%apachet] "%method %url %protocol" %statuscode %rspsize "%referer" "%ua" %rsptime'
  logDownloadStorageDays:
    type: integer
    description: Number of days to store the logs.
    minimum: 1
    maximum: 30
    default: 14
  logDownloadFileSpanMinutes:
    type: integer
    description: Time span of each log file in minutes.
    default: 30
    enum:
      - 5
      - 15
      - 30
      - 60
      - 120
      - 240
      - 480
      - 1440
required:
  - hostnames
