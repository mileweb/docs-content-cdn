title: updateServiceQuotaBody
type: object
description: This object contains the fields of the service quota that can be updated.
properties:
  contractId:
    type: string
    description: ID representing the contract used for billing for use of the service.
  hostnameLimit:
    type: integer
    description: |
      Maximum number of hostnames allowed in production.
    default: 100
  propertyLimit:
    type: integer
    default: 100
    description: |
      Maximum number of properties that can be created.
  certificateLimit:
    type: integer
    default: 100
    description: Maximum number of certificates that can be created.
  edgeHostnameLimit:
    type: integer
    description: Maximum number of edge hostnames that can be created.
    default: 100
  filePurgeQuotaInStaging:
    type: integer
    default: 5000
    description: Maximum number of file purges allowed in the staging environment in a 24-hour rolling window.
  dirPurgeQuotaInStaging:
    type: integer
    default: 20
    description: Maximum number of directory purges allowed in the staging environment in a 24-hour rolling window. This limit is also used as the maximum number of regular expression purges allowed in staging.
  filePurgeQuotaInProduction:
    type: integer
    default: 5000
    description: Maximum number of file purges allowed in the production environment in a 24-hour rolling window.
  dirPurgeQuotaInProduction:
    type: integer
    default: 20
    description: Maximum number of directory purges allowed in the production environment in a 24-hour rolling window. This limit is also used as the maximum number of regular expression purges allowed in production.
  prefetchQuota:
    type: integer
    default: 5000
    description: Maximum number of prefetch requests in a 24-hour window.
  logConfigLimit:
    type: integer
    default: 100
    description: Maximum number of log configurations.
  allowedCacheDirectives:
    type: array
    description: A list of [advanced Edge Logic directives](</docs/edge-logic/supported-directives>) that are permitted to be used.
    items:
      type: string
  status:
    type: string
    description: Indicates the status of the customer's access to the CDN Pro product.  An <i>active</i> customer has full access. A <i>suspended</i> customer no longer has access but may return to use the service. A <i>trial</i> customer is one with trial settings which may be more limited than those of a customer with the <i>active</i> status. A <i>terminated</i> customer no longer has access.
    enum:
      - active
      - suspended
      - trial
      - terminated
  allowProduction:
    type: boolean
    description: Indicates if deployment to production servers is permitted. Deployment to staging servers is always permitted.
    default: false
  usageLimitDollar:
    type: integer
    description: |
      This setting applies to trial customers. It represents the amount of traffic valued in US dollars that is permitted to be used over a period of time  set by the <i>usageLimitDays</i> field. For example, a value of 90 for <i>usageLimitDays</i> and 50 for <i>usageLimitDollar</i> means the customer can use up to $50 worth of total traffic over a 90 day period. The dollar value is based on CDN Pro's default pricing.
    minimum: 0
  usageLimitDays:
    type: integer
    minimum: 0
    maximum: 365
    description: |
      This setting applies to trial customers. It is used to limit traffic use. It represents the number of days over which the traffic amount designated by the <i>usageLimitDollar</i> field can be used. For example, a value of 90 for <i>usageLimitDays</i> and 50 for <i>usageLimitDollar</i> means the customer can use up to $50 worth of total traffic over a 90 day period.
  allowDeploymentInChina:
    type: boolean
    description: 'Indicates whether deployment to PoPs in mainland China is permitted. An ICP Beian license is required for web content to be hosted on servers within China. A reseller must collect and verify a child customer''s name, address, phone, responsible person, and China business information before enabling deployment to China. Those settings are specified when <a href="/apidocs/customer-management/post-ngadmin-customers">creating</a> or <a href="/apidocs/customer-management/patch-ngadmin-customers-id">updating</a> a customer.'
    default: false
  trialDeadline:
    type: string
    description: A date in RFC 3339 format indicating when the trial expires. This field is required if the <i>status</i> field's value is <i>trial</i>.
    format: date-time
  advancedFeatures:
    type: array
    description: 'List of advanced features that are available to the customer. Currently supported features include: "realTimeLog", which allows a customer to monitor requests from their client as they are received; "nearChina" allowing a customer without ICP Beian to use a server group consisting of nodes close to mainland China; and "originShield", which provides an extra layer of servers between the CDN Pro edge servers and origin servers. Please contact our support team if you require an advanced feature.'
    items:
      type: string
  directiveParameterLimits:
    $ref: ./directiveParameterLimits.v1.yaml
  billUsingStripe:
    type: boolean
    description: 'Whether the customer will be invoiced using Stripe payment processing. If you are a reseller who plans to use Stripe to bill your child customers, you can specify <i>true</i>. Otherwise, <i>false</i> is more appropriate. {{title}} will not bill your customers for you.'
  webhookLimit:
    type: integer
    description: Total number of webhooks that can be created.
    minimum: 0
    default: 100
  secretLimit:
    type: integer
    default: 100
    minimum: 0
    description: Total number of secrets that can be created.
  edgeHostnameZones:
    type: array
    description: 'List of zones specifying the domains that can be used for <a href="/apidocs/edge-hostname-management">edge hostnames</a>. Our default is <i>qtlcdn.com</i>. Each new edge hostname you create is a subdomain of .qtlcdn.com (for example, abcdefghi123.qtlcdn.com). If you are a reseller and want to use your own domain as the suffix instead, please contact us about adding this feature to your contract. You will need to delegate the domain''s authoritative DNS to us.'
    items:
      type: object
      properties:
        name:
          type: string
          description: A domain to use for edge hostnames.
        hasBeian:
          type: boolean
          description: 'Whether the domain has ICP Beian which is required for content to be hosted on servers in China. If set to true, every property''s hostname that points to an edge hostname using this domain must have ICP Beian.'
  maxFilePurgeEntries:
    type: integer
    minimum: 1
    description: Maximum number of file URLs that can be included in the fileUrls field of a <a href="/apidocs/content-management/createpurge">purge request</a>.
    default: 1000
  maxDirPurgeEntries:
    type: integer
    minimum: 1
    description: Maximum number of directory URLs that can be included in the dirUrls field of a <a href="/apidocs/content-management/createpurge">purge request</a>.
    default: 20
  accountManagerEmail:
    type: string
    description: An email address representing the account manager.
  allowedLbDirectives:
    type: array
    description: 'A list of advanced Edge Logic directives that can be used in the loadBalancerLogic field of a property in addition to the set of basic load balancer directives listed in the  <a href="/apidocs/cdn-product-management/get-cdn-systemconfigs">system configuration API</a>. If you require an advanced load balancer directive, please contact our support team.'
    items:
      type: string
  allowedServerGroups:
    type: array
    description: 'List of server groups the customer is permitted to use. This can be used to manage costs. Access to a higher level server group includes access to lower level groups. In particular, <i>ultra</i> includes <i>standard</i>, <i>premium</i>, and <i>deluxe</i>; <i>deluxe</i> includes <i>premium</i> and <i>standard</i>; <i>premium</i> includes <i>standard</i>; and <i>ChinaPremium</i> includes <i>ChinaStandard</i>.'
    items:
      type: string
      enum:
        - standard
        - premium
        - deluxe
        - ultra
        - nearChina
        - ChinaStandard
        - ChinaPremium
  privateDomains:
    type: array
    description: 'List of domains that the customer owns. Only this customer can create properties specifying these domains in the hostnames field. '
    items:
      type: string
