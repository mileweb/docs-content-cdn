title: propertyConfiguration
type: object
description: Describes a property configuration. This contains all the settings.
x-examples:
  example-1:
    value:
      syntaxVersion: 1
      edgeLogic: 'location / {origin_pass my_origin_1572420965460;}'
      tlsMaxVersion: '1.2'
      tlsMinVersion: '1.1'
      tlsCertificateId: 8961b13c87cd30a7687edc8c
      origins:
        - hostHeader: testcustomer.g.qtlcdn.com
          servers:
            - edgetools.theoriginserver.com
          name: my_origin_1572420965460
          directConnection: noDirect
      hostnames:
        - testcustomer1572420596536.g.qtlcdn.com
properties:
  description:
    type: string
    description: |
      A description of the version.
    maxLength: 10000
  hostnames:
    type: array
    description: 'Hostnames associated with the property. A valid value is a fully qualified hostname such as www.domain.com or a wildcard hostname such as *.domain.com. Any given hostname can only be in one deployed property at a particular time. However, a wildcard hostname is permitted to overlap other hostnames you own.'
    items:
      type: string
  hasBeian:
    type: boolean
    default: false
    description: The value indicates whether all the hostnames in this property have Beian license on file with the Chinese government. This is required to serve this property from servers in mainland China. A value of <i>false</i> means servers outside of mainland China will be used to distribute content to visitors in China. If set to <i>true</i> you must also specify the content type in the <i>beianContentType</i> field.
  beianContentType:
    type: integer
    minimum: 1
    maximum: 24
    description: |-
      If you are planning to distribute content through servers in mainland China, you will need to set the <i>hasBeian</i> field to <i>true</i> and also indicate the type of content you are distributing. Enter the value that best corresponds to your content:

      <table>
      <tr><th>Value</th><th>Content Type</th></tr>
      <tr><td>1</td><td>Instant Messaging</td></tr>
      <tr><td>2</td><td>Search Engine</td></tr>
      <tr><td>3</td><td>Web Portal</td></tr>
      <tr><td>4</td><td>Online Postal Service</td></tr>
      <tr><td>5</td><td>Online News</td></tr>
      <tr><td>6</td><td>Blog</td></tr>
      <tr><td>7</td><td>Advertisement</td></tr>
      <tr><td>8</td><td>Organization Web Portal</td></tr>
      <tr><td>9</td><td>Shopping</td></tr>
      <tr><td>10</td><td>Online Payment</td></tr>
      <tr><td>11</td><td>Online Bank</td></tr>
      <tr><td>12</td><td>Online Stock Market</td></tr>
      <tr><td>13</td><td>Online Gaming</td></tr>
      <tr><td>14</td><td>Online Music</td></tr>
      <tr><td>15</td><td>Online Movie</td></tr>
      <tr><td>16</td><td>Online Picture</td></tr>
      <tr><td>17</td><td>Software Download</td></tr>
      <tr><td>18</td><td>Job Hunting</td></tr>
      <tr><td>19</td><td>Online Dating</td></tr>
      <tr><td>20</td><td>Online Real Property</td></tr>
      <tr><td>21</td><td>Online Education</td></tr>
      <tr><td>22</td><td>Web Design</td></tr>
      <tr><td>23</td><td>WAP</td></tr>
      <tr><td>24</td><td>Others</td></tr>
      </table>
  origins:
    type: array
    description: Describes the origin servers for the property's content.
    items:
      type: object
      description: Describes an origin server.
      properties:
        name:
          type: string
          description: |
            Name of an origin. It must be unique within this property.
          pattern: '^[a-zA-z0-9_]'
        servers:
          type: array
          description: |
            Each entry should be a string consisting of an address optionally followed by one or more parameters, separated by space characters. The address can take one of the following three forms:
            <ul>
            <li>{hostname or IP address}</li>
            <li>{hostname or IP address}:{HTTP port}</li>
            <li>{hostname or IP address}:{HTTP port},{HTTPS port}</li>
            </ul>

            The IP address can be either IPv4 or IPv6.  IPv6 is supported if the property's <i>enableIpv6Origin</i> setting is <i>true</i>.  IPv6 addresses can be specified in uncompressed or compressed format, for example, <code>2001:1234:0000:0000:1b12:0000:0000:1a13</code> or <code>2001:1234::1b12:0:0:1a13</code>.

            Values for the HTTP and HTTPS ports should be integers in the range [1,65535]. 
            Even if the value of <i>supportedProtocol</i> is "https", the HTTPS port must be specified after the comma.
            In the third form, one of the two ports can be empty.

            If specifying an IPv6 address along with a port, the IPv6 address should be enclosed in brackets, for example, <code>[2001:0DB7:AC10:FE01:0000:0000:0000:0000]:8080</code>

            Supported parameters are "backup" and "weight".

            "backup" is used to indicate the server is a backup server. It will be used when the primary servers are unavailable.

            "weight" is a value in the range [1, 100]. The default value is 1. It lets you control the likelihood that one origin server will be used relative to another.

            There should be at least one primary server defined; it does not have the "backup" parameter.

            Example:
            <code>["www.abc.com weight=1", "www1.abc.com:8080 weight=4", "www2.abc.com:880,4443 backup"]</code>

            This example specifies two primary servers which are used in a 1:4 ratio meaning one gets about 20% of the requests to origin while the other gets 80% of the requests. In addition, a backup server is specified.
          example: '["www.abc.com", "www1.abc.com:8080", "www2.abc.com:880,4443 backup"]'
          items:
            type: string
        supportedProtocol:
          type: string
          description: 'This optional field indicates the protocol supported by the origin server. If this property has a certificate attached to it, the value can be set to <i>http</i> if the <i>allowProtocolDowngrade</i> field is also set to <i>true</i>.'
          enum:
            - http
            - https
            - both
          default: both
        verifyOrigin:
          type: boolean
          default: false
          description: Optional. It controls whether the cache will validate the certificate of the origin.
        hostHeader:
          type: string
          description: |-
            Optional. It should be a valid hostname. It will also be used as the SNI servername when contacting the HTTPS origin. We also allow it to be an nginx variable that begins with ‘$’ followed by [a-z_]{3,60}. Nginx variable names are case insensitive, so we only allow lowercase characters.
            If not specified, the value of the HOST header in the request will be used. 

            One constraint is that if "awsS3" is specified for origin authentication, the value of <i>hostHeader</i> cannot be a variable or empty. It has to be a valid Amazon S3 or S3-compatible hostname. Refer to https://docs.aws.amazon.com/AmazonS3/latest/dev/VirtualHosting.html
          format: hostname
        directConnection:
          type: string
          default: auto
          description: |
            Optional. This parameter tells us how important it is to directly go to this origin without going through any intermediate cache to fetch content. The values can be "noDirect", "auto", "alwaysDirect".

            "noDirect" means we always go through at least one intermediate cache. Customers who care particularly about the origin's workload can use this option. Our cache scheduler will dynamically pick the intermediate cache based on performance and resource availability.

            "auto" means the cache scheduler will make the choice dynamically based on performance and resource availability. This is the default behavior if not specified.

            "alwaysDirect" means we always directly connect to this origin.
        shield:
          type: string
          description: 'Refers to the ID of an origin shield representing a set of servers that will make requests to your origin servers rather than the CDN Pro edge servers. This can help further reduce traffic to your origin. This is an advanced feature that can be enabled by contacting our support team. The <a href="#operation/get-cdn-shields">origin shields API</a> provides a list of available shields along with their IP addresses. It is best if you select a shield whose region is closest to your origin servers. Use of a shield in China requires your property have ''hasBeian'' set to <i>true</i>. If your origin servers have an access control list, add the IPs of the shield you choose to use.'
        keepAliveTimeout:
          type: integer
          default: 60
          description: Timeout in seconds during which an idle keepalive connection to an upstream server will stay open. A service quota setting of <i>maxUpstreamKeepaliveTimeOut</i> can change the maximum permitted value.
          minimum: 5
          maximum: 600
        peerFailureTimeout:
          type:
            - string
            - object
          description: 'This setting allows you to specify the number of unsuccessful attempts to reach one of the origin''s IP addresses or peers before it is marked as <i>unavailable</i> for a period of time designated by the timeout. The number of attempts should be specified in a subfield of the peerFailureTimeout object called <i>failureThreshold</i> while the timeout in seconds should be in a subfield called <i>timeout</i>. If all peers of all servers are unavailable, requests for content from the origin will receive an immediate 502 HTTP response. By default, six attempts to a peer are made, after which a one-second timeout applies to that peer. To disable this feature, set peerFailureTimeout to "<i>off</i>".'
          properties:
            failureThreshold:
              type: integer
              minimum: 1
              maximum: 999
              default: 6
              description: Number of attempts to connect to a peer before it is considered unavailable.
            timeout:
              type: integer
              minimum: 1
              maximum: 1200
              default: 1
              description: Timeout in seconds.
        peerSelectionAlgorithm:
          type: string
          x-stoplight:
            id: vd1adbrntml4p
          enum:
            - round_robin
            - consistent_hash
            - sorted_list
          default: round_robin
          description: 'This setting controls how the origin server is selected when an origin server''s hostname resolves to multiple IP addresses. <table><tr><td>round_robin</td><td> Rotate among the peers sequentially. This is the default setting, which tries to evenly distribute the origin traffic to all the peers.</td></tr><tr><td>consistent_hash</td><td>Distribute the origin traffic based on the hash value of the URL. If the origin server has a cache, this option should help with the hit ratio.</td></tr><tr><td>sorted_list</td><td>Select the peer based on the network quality. When the origin peers are geographically distributed (such as another CDN), this option should help ensure consistent performance.</td></tr></table>'
        maxConnections:
          type: integer
          minimum: 0
          default: 0
          description: 'Defines the maximum number of simultaneous connections to the origin. The default is ''0'', which indicates connections are unlimited.'
        tlsCertificateId:
          type: string
          description: Refers to a <a href="#tag/Certificate-Management">certificate</a> used to authenticate with the origin server. This certificate must also be deployed.
        authentication:
          type: object
          description: |-
            Optional. It is a structure to specify the parameters, such as password, for authentication with the origin servers. It should have at least one field: "methodName", which should be a string indicating one of the predefined authentication methods. The only valid value at this time is "awsS3". When "awsS3" is used, the following parameters are required:
            <ul>
            <li>awsS3.region</li>
            <li>awsS3.accessKey</li>
            <li>awsS3.secretKey</li>
            </ul>

            The value specified for "awsS3.secretKey" must not be plain text secret key. Instead, create a "secret" object, and then use the `$SECRET(secret.name)` syntax here to refer to the secret containing the secret key. This avoids exposure of the sensitive information.

            Example:
            <code>
            {"methodName":"awsS3",
            "awsS3":{
            "region":"us-west-1",
            "accessKey":"sdnu2932",
            "secretKey":"$SECRET(mysecret)"
            }}
            </code>
          example: '{"methodName":"awsS3", "awsS3":{ "region":"us-west-1", "accessKey":"sdnu2932", "secretKey":"d12133424fvregvrew" }}'
          properties:
            methodName:
              type: string
              description: Authentication method.
      required:
        - name
        - servers
  allowProtocolDowngrade:
    type: boolean
    default: false
    description: |
      This setting applies only if the property has an attached certificate allowing client requests to use HTTPS. If the value of allowProtocolDowngrade is <i>false</i>, we require all the origin servers to support HTTPS. If the value is <i>true</i>, we allow origins that support only HTTP, which reduces security.
  enableIpv6Origin:
    type: boolean
    default: false
    description: Enable use of IPv6 addresses to access the property's origin servers.
  followClientIpVersion:
    type: string
    enum:
      - auto
      - strict
      - 'off'
    default: 'off'
    description: 'When enableIpv6Origin is enabled, this setting controls whether to match the addressing method used by a client if a request to the origin is required to fetch content. <table><tr><th>Value</th><th>Behavior</th></tr><tr><td>auto</td><td>Attempt to reach the origin server using the same IP addressing as the client, but use the other version as backup if needed.</td></tr><tr><td>strict</td><td>Use only the same addressing method as the client when accessing the origin for content.</td></tr><tr><td>off</td><td>Use both IPv4 and IPv6 addressing to reach the origin, regardless of the IP addressing method used by the client.</td></tr></table>'
  edgeLogic:
    type: string
    maxLength: 65530
    description: 'Refer to the [Edge Logic Introduction](</docs/edge-logic/intro>) to learn how to use the NGINX language to further customize CDN Pro to meet your business requirements.'
  syntaxVersion:
    type: number
    description: The value must be set to 1 at this time.
  cacheKeyHostname:
    type: string
    description: |
      The cachekey hostname must be a string made of lowercase letters, digits, dot, dash, and underscore. If not specified, the incoming Host header value will be used and the cache will not be shared across different hostnames in this property.
    maxLength: 80
  cacheKeyUri:
    type: string
    enum:
      - preRewrite
      - postRewrite
    default: preRewrite
    description: 'This setting controls how the URI of the incoming request is incorporated into the cache key if you use a "rewrite" directive in the property''s Edge Logic. The default value, "preRewrite", puts the unmodified URI into the cache key while "postRewrite" uses the modified URI. If your rewrite directive converts multiple different URIs into the same value, using "postRewrite" may result in a higher cache hit ratio.'
  schemeInCacheKey:
    type: boolean
    default: false
    description: |
      Specifies whether the scheme ("http" or "https") should be included in the cache key. Default behavior is </i>false</i>. Set to <i>true</i> if the content is known to be different for different schemes.
  redirectHttpToHttps:
    type:
      - boolean
      - string
    default: false
    description: 'This field can be set to either a boolean value or a string. If the value is set to <i>true</i>, the server will redirect all HTTP requests to HTTPS using status code 301. You can also specify string values "302", "307", or "308" instead if you wish to return a different status code when a request is redirected.'
  disableHttp2:
    type: boolean
    default: false
    description: 'Set to <i>true</i> to disable support for HTTP/2 and support only HTTP 1.1. HTTP/2 requires TLS to work, so you must specify a certificate in the tlsCertificateId field to support HTTP/2.'
  enableHttp3:
    type: boolean
    x-stoplight:
      id: dh1mxvtyud0vj
    description: 'Set to <i>true</i> to enable support for HTTP/3. HTTP/3 requires TLS to work, so this field will be ignored unless you specify a certificate in the tlsCertificateId field.'
    default: false
  extraServicePorts:
    type: object
    description: 'This field lists ports other than the default 80 used to handle HTTP requests and ports other than the default 443 used to handle HTTPS requests. '
    properties:
      http:
        type: array
        description: 'This is a list of ports other than 80 which are used to handle HTTP requests. The available values can be found in the <a href="#operation/get-cdn-systemConfigs">systemConfigs</a> API''s response. If you need another port, please contact our support team.'
        items:
          type: integer
          minimum: 0
          maximum: 65535
      https:
        type: array
        description: 'This is a list of ports other than 443 which are used to handle HTTPS requests. The available values can be found in the <a href="#operation/get-cdn-systemConfigs">systemConfigs</a> API''s response. If you need another port, please contact our support team.'
        items:
          type: integer
          minimum: 0
          maximum: 65535
  tlsCertificateId:
    type: string
    description: Refers to a <a href="#tag/Certificate-Management">certificate</a>. Specify a certificate to enable HTTPS for the hostnames of this property. It can be of type RSA or EC.
  tlsCertificateId1:
    type: string
    description: |
      Refers to a <a href="#tag/Certificate-Management">certificate</a>. Optionally specify a second certificate to be used for HTTPS for the hostnames of this property. It must be of a different type (RSA or EC) than the certificate specified in <i>tlsCertificateId</i>. When there are two certificates available for your hostnames, the client and server will negotiate at the time of requests to pick one of the certificates for SSL. This could mean better performance and fault tolerance.  It is invalid to set only the <i>tlsCertificateId1</i> field without setting the <i>tlsCertificateId</i> field.
  tlsMinVersion:
    type: string
    default: 1
    description: 'Minimum required TLS version. TLS versions 1.0 and 1.1 have been deprecated for security reasons, so we strongly recommend a minimum of TLS 1.2.'
    enum:
      - 1.1
      - 1.2
      - 1.3
      - 1
  tlsMaxVersion:
    type: string
    default: 1.3
    enum:
      - 1.1
      - 1.2
      - 1.3
    description: 'Maximum supported TLS version. TLS versions 1.0 and 1.1 have been deprecated for security reasons, so we strongly recommend a minimum of TLS 1.2.'
  tlsCiphers:
    type: string
    description: |
      Any cipher list supported by "openssl ciphers". See https://www.openssl.org/docs/manmaster/man1/ciphers.html
    maxLength: 2040
  enableOcspStapling:
    type: boolean
    default: false
    description: 'Enables <a href="https://en.wikipedia.org/wiki/OCSP_stapling">Online Certificate Status Protocol (OCSP) stapling</a> to check the revocation status of digital certificates. No OCSP response will be stapled to TLS handshakes if there is no OCSP URL specified on your certificate.'
  tls0Rtt:
    type: boolean
    default: false
    description: 'Enable TLS zero round-trip time, a feature of TLS 1.3 that can improve performance for repeat visits to a site. If enabling it though, be sure your site is not vulnerable to the HTTP replay attack.'
  tlsSessionTimeout:
    type: integer
    minimum: 300
    maximum: 86400
    default: 1800
    description: Lifespan of TLS session ticket in seconds.
  tlsVerifyClient:
    type: string
    x-stoplight:
      id: yvd31sv0k0lem
    enum:
      - 'on'
      - 'off'
      - optional
      - noCA
    default: 'off'
    description: Whether to enable verification of a client's certificate. <table><tr><th>Value</th><th>Behavior</th></tr><tr><td>on</td><td>verify the client certificate</td></tr><tr><td>off</td><td>do not verify the client certificate</td></tr><tr><td>optional</td><td>request the client certificate and verify it if it is present</td></tr><tr><td>noCA</td><td>request the client certificate but do not require it to be signed by a trusted CA certificate</td></tr></table>
  tlsClientCACertId:
    type: string
    x-stoplight:
      id: ryd3oz69wsct8
    description: ID of a CA certificate. This field is required if tlsVerifyClient is <i>on</i> or <i>optional</i>.
  disableCertAutomation:
    type: boolean
    description: 'By default, CDN Pro takes control of the contents under the /.well-known/{acme-challenge, pki-validation} directories to support certificate auto-renew for properties. If for any reason you need to manage these two directories by yourself on the origin, for example, to implement your own certificate auto-renew mechanism, you can use this configuration option to disable the default behavior by setting its value to <i>true</i>. For more information about our support for certificate auto-renewal, refer to the description of the <i>autoRenew</i> field in the <a href="#operation/createCertificate">Create a certificate API</a>.'
    default: false
  accessControlRules:
    type: array
    description: Specify one or more access control rules to restrict access to your content. More advanced configuration can be done using Edge Logic. These access control rules take precedence over Edge Logic if both are defined.
    items:
      $ref: ./accessControlRule.v1.yaml
  realTimeLog:
    type: object
    description: This optional field allows you to configure notifications about client requests to be sent to a remote server. It can be used only if you have access to our <i>realtime_log_switch</i> directive. Please contact our support team if you require this feature.
    properties:
      logUrl:
        type: string
        description: The URL that receives the notifications. It must begin with "http" or "https". The server should support the POST method. This is a required field.
      sampleRate:
        type: integer
        default: 10
        minimum: 1
        maximum: 65536
        description: 'An integer between [1, 65536]. n means one notification for every n edge requests. A value of 1 means every edge request will generate a notification. The default of 10 means a notification is sent for every 10 edge requests.'
      escape:
        type: string
        enum:
          - json
          - none
          - compactJson
        description: 'Specify <i>json</i> to enable JSON character escaping in variables, <i>compactJson</i> to enable JSON character escaping with whitespace in the body removed, or <i>none</i> to disable escaping.'
        default: none
      format:
        type: string
        description: |-
          This is a required field to specify the notification body to be sent to the remote server. It can be any printable text that can be sent in the body of an HTTP POST request. 

          Use the [built-in variables](</docs/edge-logic/built-in-variables>) within the format field. They will be replaced with the actual values in the notifications.
      headers:
        type: array
        description: 'HTTP header names and values to be sent to the notification server. A header name can contain any alphanumeric character or hyphen, "-". A header value can contain any printable characters. It can also include any of the built-in variables supported in the <i>format</i> field of the realTimeLog object.'
        items:
          type: object
          properties:
            name:
              type: string
              description: Name of an HTTP header.
            value:
              type: string
              description: Value of an HTTP header.
    required:
      - logUrl
      - format
  videoSeek:
    type: object
    description: 'This object allows you to support video players requesting partial content through query string parameters. If you specify <i>videoSeek</i>, you must enter a value for <i>startParameter</i>.'
    properties:
      startParameter:
        type: string
        description: 'Name of the query parameter indicating the starting offset in bytes of the content to fetch. The parameter name should begin with a letter (a-z, A-Z) and may be followed by up to 30 letters and numbers.'
        minLength: 1
        maxLength: 31
      endParameter:
        type: string
        description: 'Name of the query parameter indicating the ending offset of the content to fetch. The parameter name should begin with a letter (a-z, A-Z) and may be followed by up to 30 letters and numbers.'
        minLength: 0
        maxLength: 31
    required:
      - startParameter
  'loadBalancerLogic ':
    type: string
    description: |-
      This field allows you to enter [Edge Logic](</docs/edge-logic/intro>) to customize load balancing. A subset of the [directives](</docs/edge-logic/supported-directives>)  can be used. Refer to the basic directives listed in the <i>baseLbDirectives</i> field of the response to the <a href="#operation/get-cdn-systemConfigs">system configuration API</a>. Currently, these include "if", "else", "elseif", "set", "return", "add_header", "deny", "allow", "access_log_sampling", and "proxy_set_header." In addition, some advanced Edge Logic directives, identified by the system configuration API's <i>advancedLbDirectives</i>, can be enabled for your account if needed. Please contact our support team if you require any of them. <br/> Example use: <br /><code>
      if ($http_user_agent = bot) { return 403;}
      </code>

       <b>Note:</b> Due to our upgrade of the CDN Pro edge node structure, the loadBalancerLogic field will be deprecated soon. Please avoid using this field. All the supported directives should be configured in the edgeLogic field only. Please refer to [this guide](</docs/edge-logic/edge-node-structure-upgrade>) for more details.
    maxLength: 65530
    deprecated: true
required:
  - hostnames
  - origins
  - edgeLogic
  - syntaxVersion
