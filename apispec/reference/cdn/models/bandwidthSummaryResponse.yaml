title: bandwidthSummaryResponse
type: object
description: This describes the response to the bandwidth summary report APIs.
examples:
  - metaData:
      startTime: '2021-10-01T12:35:00Z'
      endTime: '2021-11-12T12:40:00Z'
      isComplete: true
      dataNames:
        - edge bandwidth
      dataUnit: megabits per second
    groups:
      - group: __all__
        data:
          - 76763.00002
      - group: hostname1.domain.info
        data:
          - 123.00001
      - group: hostname2.domain.info
        data:
          - 67580.00001
      - group: hostname3.domain.info
        data:
          - 8720
      - group: zi.domain.info
        data:
          - 340
properties:
  metaData:
    type: object
    properties:
      startTime:
        type: string
        description: RFC 3339 date indicating the beginning of the period.
        format: date-time
      endTime:
        type: string
        description: RFC 3339 date indicating the end.
        format: date-time
      isComplete:
        type: boolean
        description: 'The response can contain up to 10000 groups. If there are more groups, <i>isComplete</i> will be <i>false</i>.'
      dataNames:
        type: array
        description: 'Indicates the type of data returned. "edge bandwidth" represents edge bandwidth traffic. '
        items:
          type: string
      dataUnit:
        type: string
        description: Indicates the unit of measurement of the returned values.
    required:
      - isComplete
  groups:
    type: array
    description: This object contains the breakdown of traffic by group. Groups are determined by the request body.
    items:
      type: object
      properties:
        group:
          type: string
          description: Name of a group.  "\_\_all\_\_" is a special group encompassing all groups.
        data:
          type: array
          description: Data values. The units of measurement are determined by the dataUnit field.
          items:
            type: number
